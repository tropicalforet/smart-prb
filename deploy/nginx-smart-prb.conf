# Nginx untuk SMART PRB. __DOMAIN__ dan __PHP_VER__ diganti otomatis oleh setup-vps.sh.
# Blok HTTPS (port 443) ditambahkan oleh Certbot.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    root /var/www/smart-prb/public;

    index index.php;
    charset utf-8;
    client_max_body_size 20M;   # unggah file Excel

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php__PHP_VER__-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # File tersembunyi (.env, .git) tidak boleh diakses
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(js|css|png|jpg|svg|woff2?)$ {
        expires 30d;
        access_log off;
    }
}
